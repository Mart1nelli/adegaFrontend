<div class="min-h-screen bg-bg text-text-main flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="text-4xl mb-4">🥂</div>
      <h1 class="text-2xl font-black tracking-tight">Criar Conta</h1>
      <p class="text-text-muted text-sm mt-2">Junte-se à nossa adega exclusiva</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="flex flex-col gap-2">
        <label
          for="reg-name"
          class="text-[10px] font-bold uppercase text-text-muted tracking-widest"
          >Nome completo</label
        >
        <div class="relative flex items-center">
          <ng-icon name="heroUser" size="18" class="absolute left-3 text-text-muted"></ng-icon>
          <input
            id="reg-name"
            type="text"
            [(ngModel)]="registerData().name"
            name="name"
            placeholder="Como podemos te chamar?"
            class="input-field pl-10"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label
          for="reg-email"
          class="text-[10px] font-bold uppercase text-text-muted tracking-widest"
          >E-mail</label
        >
        <div class="relative flex items-center">
          <ng-icon name="heroEnvelope" size="18" class="absolute left-3 text-text-muted"></ng-icon>
          <input
            id="reg-email"
            type="email"
            [(ngModel)]="registerData().email"
            name="email"
            placeholder="seu@email.com"
            class="input-field pl-10"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label
          for="reg-password"
          class="text-[10px] font-bold uppercase text-text-muted tracking-widest"
          >Senha</label
        >
        <div class="relative flex items-center">
          <ng-icon
            name="heroLockClosed"
            size="18"
            class="absolute left-3 text-text-muted"
          ></ng-icon>
          <input
            id="reg-password"
            type="password"
            [(ngModel)]="registerData().password"
            name="password"
            placeholder="••••••••"
            class="input-field pl-10"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label
          for="reg-phone"
          class="text-[10px] font-bold uppercase text-text-muted tracking-widest"
        >
          Telefone <span class="text-text-dim font-normal normal-case">(opcional)</span>
        </label>
        <div class="relative flex items-center">
          <ng-icon
            name="heroDevicePhoneMobile"
            size="18"
            class="absolute left-3 text-text-muted"
          ></ng-icon>
          <input
            id="reg-phone"
            type="tel"
            [(ngModel)]="registerData().phone"
            name="phone"
            placeholder="(11) 99999-9999"
            class="input-field pl-10"
          />
        </div>
      </div>

      @if (errorMessage()) {
        <div
          class="bg-danger/10 border border-danger text-danger text-xs p-3 rounded-lg text-center"
        >
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" [disabled]="isLoading()" class="btn-primary w-full py-3.5 mt-2">
        {{ isLoading() ? 'Criando conta...' : 'Criar conta grátis' }}
      </button>
    </form>

    <div class="text-center mt-8 border-t border-border pt-6">
      <p class="text-sm text-text-muted">
        Já tem conta?
        <a routerLink="/auth/login" class="text-primary font-bold hover:underline ml-1"
          >Fazer login</a
        >
      </p>
    </div>
  </div>
</div>
