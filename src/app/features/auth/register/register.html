<div class="min-h-screen bg-dark-bg flex items-center justify-center px-4 py-12">
  <!-- Background glow -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute top-1/4 left-1/2 -translate-x-1/2 w-150 h-150 rounded-full bg-primary/5 blur-[120px]"
    ></div>
    <div
      class="absolute bottom-1/4 right-1/4 w-75 h-75 rounded-full bg-secondary/5 blur-[80px]"
    ></div>
  </div>

  <div class="relative w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 border border-primary/20 mb-4"
      >
        <span class="text-3xl">🍺</span>
      </div>
      <h1 class="text-3xl font-black text-primary font-[Fredoka]">Adega do Pai</h1>
      <p class="text-white/40 text-sm mt-1">Crie sua conta e aproveite!</p>
    </div>

    <!-- Card -->
    <div
      class="bg-dark-surface border border-primary/15 rounded-2xl p-8 shadow-[0_0_60px_rgba(254,217,15,0.06)]"
    >
      <h2 class="text-white font-bold text-xl mb-6">Criar conta</h2>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Nome -->
        <div class="space-y-1.5">
          <label for="name" class="text-white/60 text-sm font-medium">Nome completo</label>
          <div class="relative">
            <ng-icon
              name="heroUser"
              size="16"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-primary/50 pointer-events-none"
            >
            </ng-icon>
            <input
              id="name"
              type="text"
              [(ngModel)]="registerData().name"
              name="name"
              placeholder="Seu nome completo"
              required
              class="w-full bg-dark-panel border border-primary/15 rounded-xl pl-9 pr-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label for="email" class="text-white/60 text-sm font-medium">E-mail</label>
          <div class="relative">
            <ng-icon
              name="heroEnvelope"
              size="16"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-primary/50 pointer-events-none"
            >
            </ng-icon>
            <input
              id="email"
              type="email"
              [(ngModel)]="registerData().email"
              name="email"
              placeholder="seu@email.com"
              required
              class="w-full bg-dark-panel border border-primary/15 rounded-xl pl-9 pr-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Senha -->
        <div class="space-y-1.5">
          <label for="password" class="text-white/60 text-sm font-medium">Senha</label>
          <div class="relative">
            <ng-icon
              name="heroLockClosed"
              size="16"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-primary/50 pointer-events-none"
            >
            </ng-icon>
            <input
              id="password"
              type="password"
              [(ngModel)]="registerData().password"
              name="password"
              placeholder="Crie uma senha forte"
              required
              class="w-full bg-dark-panel border border-primary/15 rounded-xl pl-9 pr-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Telefone -->
        <div class="space-y-1.5">
          <label for="phone" class="text-white/60 text-sm font-medium"
            >Telefone <span class="text-white/30">(opcional)</span></label
          >
          <div class="relative">
            <ng-icon
              name="heroDevicePhoneMobile"
              size="16"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-primary/50 pointer-events-none"
            >
            </ng-icon>
            <input
              id="phone"
              type="tel"
              [(ngModel)]="registerData().phone"
              name="phone"
              placeholder="(11) 99999-9999"
              class="w-full bg-dark-panel border border-primary/15 rounded-xl pl-9 pr-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Error -->
        @if (errorMessage()) {
          <div
            class="bg-secondary/10 border border-secondary/30 rounded-xl px-4 py-3 text-secondary text-sm"
          >
            ⚠️ {{ errorMessage() }}
          </div>
        }

        <!-- Botão -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full bg-primary hover:bg-primary-hover disabled:opacity-50 disabled:cursor-not-allowed text-dark-bg font-bold py-3.5 rounded-xl transition-all duration-200 hover:shadow-[0_0_20px_rgba(254,217,15,0.3)] active:scale-[0.98] text-sm mt-2"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <span
                class="w-4 h-4 rounded-full border-2 border-dark-bg/30 border-t-dark-bg animate-spin"
              ></span>
              Cadastrando...
            </span>
          } @else {
            Criar conta grátis
          }
        </button>
      </form>

      <!-- Link login -->
      <p class="text-center text-white/40 text-sm mt-6">
        Já tem conta?
        <a
          routerLink="/auth/login"
          class="text-primary font-semibold hover:text-primary-hover transition-colors ml-1"
        >
          Fazer login
        </a>
      </p>
    </div>
  </div>
</div>
