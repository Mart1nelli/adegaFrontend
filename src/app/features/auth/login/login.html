<div class="min-h-screen bg-bg text-white flex items-center justify-center p-4">
  <div class="card w-full max-w-sm p-8">
    <div class="text-center mb-8">
      <div class="text-4xl mb-4">🍷</div>
      <h1 class="text-2xl font-bold tracking-tight">Entrar na Adega</h1>
      <p class="text-gray-400 text-sm mt-2">Bem-vindo de volta</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="email" class="text-xs font-bold uppercase text-gray-500 tracking-wider"
          >Email</label
        >
        <div class="relative flex items-center">
          <ng-icon name="heroEnvelope" size="18" class="absolute left-3 text-gray-500"></ng-icon>
          <input
            id="email"
            type="email"
            [(ngModel)]="loginData().email"
            name="email"
            placeholder="nome@exemplo.com"
            class="input-field pl-10"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="text-xs font-bold uppercase text-gray-500 tracking-wider"
          >Senha</label
        >
        <div class="relative flex items-center">
          <ng-icon name="heroLockClosed" size="18" class="absolute left-3 text-gray-500"></ng-icon>
          <input
            id="password"
            type="password"
            [(ngModel)]="loginData().password"
            name="password"
            placeholder="••••••••"
            class="input-field pl-10"
            required
          />
        </div>
      </div>

      @if (errorMessage()) {
        <div
          class="bg-red-950/30 border border-red-900 text-red-400 text-xs p-3 rounded-lg text-center"
        >
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" [disabled]="isLoading()" class="btn-primary w-full py-3 mt-2">
        {{ isLoading() ? 'Autenticando...' : 'Entrar' }}
      </button>
    </form>

    <div class="text-center mt-8 border-t border-gray-900 pt-6">
      <p class="text-sm text-gray-500">
        Não tem uma conta?
        <a routerLink="/auth/register" class="text-primary font-bold hover:underline ml-1"
          >Cadastre-se</a
        >
      </p>
    </div>
  </div>
</div>
