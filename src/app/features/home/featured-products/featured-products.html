<section class="py-20 lg:py-32 bg-bg text-text-main">
  <div class="container mx-auto px-4 max-w-7xl">
    <div class="mb-16">
      <span class="text-primary text-[10px] font-bold uppercase tracking-[0.2em] block mb-2"
        >Categorias</span
      >
      <h2 class="text-4xl lg:text-5xl font-black mb-8 tracking-tight">O que vai descer hoje?</h2>

      <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4">
        @for (cat of categories(); track cat) {
          <button
            (click)="onCategoryClick(cat)"
            [class]="
              activeCategory() === cat
                ? 'border-primary bg-primary text-black'
                : 'border-border bg-surface text-text-muted hover:border-primary'
            "
            class="px-4 py-5 rounded-xl font-bold transition-all duration-300 border-2 text-sm flex items-center justify-center w-full"
          >
            {{ cat }}
          </button>
        }
      </div>
    </div>

    <div class="flex flex-col lg:flex-row justify-between items-baseline mb-12 gap-6">
      <div>
        <span class="text-primary text-[10px] font-bold uppercase tracking-[0.2em] block mb-2"
          >Em destaque</span
        >
        <h2 class="text-4xl lg:text-5xl font-black tracking-tight">Os queridinhos</h2>
      </div>

      <a
        routerLink="/products"
        class="text-primary font-semibold hover:underline flex items-center gap-2"
      >
        Ver todos <ng-icon name="lucideChevronRight" size="18"></ng-icon>
      </a>
    </div>

    <div class="relative w-full">
      @if (isLoading()) {
        <div class="flex flex-col items-center justify-center min-h-[300px]">
          <div
            class="h-8 w-8 animate-spin rounded-full border-2 border-primary border-t-transparent"
          ></div>
        </div>
      } @else {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
          @for (product of featuredProducts(); track product.id) {
            <app-product-card
              [product]="product"
              (addToCart)="onAddToCart($event)"
            ></app-product-card>
          }
        </div>
      }
    </div>

    <div class="mt-24 border-t border-border pt-12 grid grid-cols-2 lg:grid-cols-4 gap-8">
      <div class="flex flex-col items-center gap-3 text-center">
        <div class="flex p-3 rounded-full bg-surface border border-border text-primary">
          <ng-icon name="lucideAward" size="20"></ng-icon>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-text-muted"
          >Garantia</span
        >
      </div>
      <div class="flex flex-col items-center gap-3 text-center">
        <div class="flex p-3 rounded-full bg-surface border border-border text-primary">
          <ng-icon name="lucideTruck" size="20"></ng-icon>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-text-muted"
          >Entrega Express</span
        >
      </div>
      <div class="flex flex-col items-center gap-3 text-center">
        <div class="flex p-3 rounded-full bg-surface border border-border text-primary">
          <ng-icon name="heroShieldCheck" size="20"></ng-icon>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-text-muted"
          >Checkout Seguro</span
        >
      </div>
      <div class="flex flex-col items-center gap-3 text-center">
        <div class="flex p-3 rounded-full bg-surface border border-border text-primary">
          <ng-icon name="heroArrowPath" size="20"></ng-icon>
        </div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-text-muted"
          >Qualidade</span
        >
      </div>
    </div>
  </div>
</section>
