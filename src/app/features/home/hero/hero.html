<section
  class="relative flex flex-col justify-center min-h-[calc(100vh-80px)] overflow-hidden bg-bg text-text-main"
  #heroSection
>
  <div class="absolute inset-0 z-0">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 rounded-full bg-primary/5 blur-[120px]"></div>
    <div
      class="absolute bottom-1/4 right-1/4 w-96 h-96 rounded-full bg-primary/5 blur-[120px]"
    ></div>
  </div>

  <div
    class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center lg:text-left text-center py-12"
  >
    <div class="lg:col-span-7 flex flex-col justify-center pt-16">
      <div
        class="inline-flex items-center gap-2 rounded-full border border-primary/20 bg-primary/5 px-4 py-1.5 mb-6 text-[10px] font-bold uppercase tracking-widest text-primary self-center lg:self-start"
      >
        <ng-icon name="lucideBeer" size="16"></ng-icon>
        <span>Bebidas selecionadas a dedo</span>
      </div>

      <h1 class="mb-6">
        <span class="block text-4xl lg:text-6xl font-black mb-4 tracking-tight">Adega do Pai</span>
        <span class="text-lg lg:text-xl text-text-muted font-light max-w-lg mx-auto lg:mx-0">
          Uma curadoria exclusiva de bebidas selecionadas para o seu momento. Elegância e sabor em
          cada rótulo.
        </span>
      </h1>

      <div class="flex flex-wrap gap-4 mb-10 justify-center lg:justify-start">
        <a routerLink="/products" class="btn-primary px-8 py-3 rounded-lg font-bold"
          >Explorar Catálogo</a
        >
        <a
          routerLink="/auth/login"
          class="px-8 py-3 rounded-lg border border-border hover:border-primary transition-all text-text-muted hover:text-text-main"
          >Fazer Login</a
        >
      </div>

      <div class="flex gap-8 justify-center lg:justify-start border-t border-border pt-8">
        <div>
          <div class="text-2xl font-bold text-primary">200+</div>
          <div class="text-[10px] uppercase tracking-widest text-text-muted">
            Rótulos Selecionados
          </div>
        </div>
        <div>
          <div class="text-2xl font-bold text-primary">15+</div>
          <div class="text-[10px] uppercase tracking-widest text-text-muted">Categorias</div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-5 flex items-center justify-center relative">
      <div
        class="w-80 h-80 rounded-full border border-primary/10 flex items-center justify-center animate-spin-slow"
      >
        <svg viewBox="0 0 200 200" class="w-64 h-64 opacity-60">
          <circle
            cx="100"
            cy="100"
            r="80"
            fill="none"
            stroke="currentColor"
            class="text-primary"
            stroke-width="1"
          />
          <circle
            cx="100"
            cy="100"
            r="40"
            fill="none"
            stroke="currentColor"
            class="text-primary"
            stroke-width="1"
            stroke-dasharray="10 5"
          />
        </svg>
      </div>
    </div>
  </div>

  <div
    class="absolute bottom-8 left-1/2 -translate-x-1/2 cursor-pointer text-text-muted hover:text-primary transition-all duration-300"
    [class.opacity-0]="isScrollIndicatorHidden"
    [class.pointer-events-none]="isScrollIndicatorHidden"
    (click)="scrollToNextSection()"
    role="button"
    tabindex="0"
    aria-label="Rolar para a próxima seção"
  >
    <ng-icon name="lucideChevronDown" size="24"></ng-icon>
  </div>
</section>
