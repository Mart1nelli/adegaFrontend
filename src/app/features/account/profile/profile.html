<div class="min-h-screen bg-[#0B0B0D] px-4 py-10">
  <div class="max-w-2xl mx-auto space-y-6">
    <div
      class="bg-[#141418] border border-[#FED90F]/15 rounded-2xl p-6 flex items-center justify-between"
    >
      <div class="flex items-center gap-4">
        <div
          class="w-14 h-14 rounded-2xl bg-[#FED90F]/10 border border-[#FED90F]/20 flex items-center justify-center text-2xl"
        >
          👤
        </div>
        <div>
          <h1 class="text-xl font-black text-[#FED90F] font-[Fredoka]">Minha Conta</h1>
          <p class="text-white/40 text-sm">Olá, {{ user?.name ?? 'Usuário' }}</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2">
      <a
        routerLink="/account/profile"
        class="text-center py-2 text-xs font-bold text-[#FED90F] bg-[#FED90F]/10 rounded-lg border border-[#FED90F]/30"
        >Perfil</a
      >
      <a
        routerLink="/account/addresses"
        class="text-center py-2 text-xs font-semibold text-white/40 hover:text-white/80 transition-colors"
        >Endereços</a
      >
      <a
        routerLink="/account/orders"
        class="text-center py-2 text-xs font-semibold text-white/40 hover:text-white/80 transition-colors"
        >Pedidos</a
      >
    </div>

    <div class="bg-[#141418] border border-[#FED90F]/15 rounded-2xl overflow-hidden">
      <div class="flex border-b border-[#FED90F]/10">
        <button
          (click)="activeTab.set('profile')"
          [class]="
            activeTab() === 'profile'
              ? 'flex-1 py-4 text-xs font-bold text-[#FED90F] border-b-2 border-[#FED90F]'
              : 'flex-1 py-4 text-xs font-medium text-white/40 hover:bg-white/5'
          "
        >
          DADOS PESSOAIS
        </button>
        <button
          (click)="activeTab.set('password')"
          [class]="
            activeTab() === 'password'
              ? 'flex-1 py-4 text-xs font-bold text-[#FED90F] border-b-2 border-[#FED90F]'
              : 'flex-1 py-4 text-xs font-medium text-white/40 hover:bg-white/5'
          "
        >
          ALTERAR SENHA
        </button>
      </div>

      <div class="p-8">
        @if (activeTab() === 'profile') {
          <form (ngSubmit)="saveProfile()" class="space-y-5">
            <div>
              <label
                for="name-input"
                class="block text-[10px] font-bold text-white/40 uppercase mb-2"
                >Nome Completo</label
              >
              <input
                id="name-input"
                [(ngModel)]="profileForm.name"
                name="name"
                class="w-full bg-[#0B0B0D] border border-white/5 rounded-xl px-4 py-3 text-white text-sm focus:border-[#FED90F]/50 outline-none transition-all"
              />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  for="email-input"
                  class="block text-[10px] font-bold text-white/40 uppercase mb-2"
                  >E-mail</label
                >
                <input
                  id="email-input"
                  [value]="user?.email ?? ''"
                  disabled
                  class="w-full bg-[#0B0B0D]/50 border border-white/5 rounded-xl px-4 py-3 text-white/30 text-sm cursor-not-allowed"
                />
              </div>
              <div>
                <label
                  for="phone-input"
                  class="block text-[10px] font-bold text-white/40 uppercase mb-2"
                  >Telefone</label
                >
                <input
                  id="phone-input"
                  [(ngModel)]="profileForm.phone"
                  name="phone"
                  class="w-full bg-[#0B0B0D] border border-white/5 rounded-xl px-4 py-3 text-white text-sm focus:border-[#FED90F]/50 outline-none transition-all"
                />
              </div>
            </div>

            <button
              type="submit"
              class="w-full bg-[#FED90F] text-[#0B0B0D] font-bold py-3 rounded-xl mt-4 hover:shadow-[0_0_20px_rgba(254,217,15,0.3)] transition-all"
            >
              Salvar Alterações
            </button>
          </form>
        }

        @if (activeTab() === 'password') {
          <form (ngSubmit)="savePassword()" class="space-y-5">
            <div>
              <label
                for="curr-pass"
                class="block text-[10px] font-bold text-white/40 uppercase mb-2"
                >Senha Atual</label
              >
              <input
                id="curr-pass"
                type="password"
                [(ngModel)]="passwordForm.currentPassword"
                name="curr"
                class="w-full bg-[#0B0B0D] border border-white/5 rounded-xl px-4 py-3 text-white text-sm focus:border-[#FED90F]/50 outline-none transition-all"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  for="new-pass"
                  class="block text-[10px] font-bold text-white/40 uppercase mb-2"
                  >Nova Senha</label
                >
                <input
                  id="new-pass"
                  type="password"
                  [(ngModel)]="passwordForm.newPassword"
                  name="new"
                  class="w-full bg-[#0B0B0D] border border-white/5 rounded-xl px-4 py-3 text-white text-sm focus:border-[#FED90F]/50 outline-none transition-all"
                />
              </div>
              <div>
                <label
                  for="conf-pass"
                  class="block text-[10px] font-bold text-white/40 uppercase mb-2"
                  >Confirmar</label
                >
                <input
                  id="conf-pass"
                  type="password"
                  [(ngModel)]="confirmPassword"
                  name="conf"
                  class="w-full bg-[#0B0B0D] border border-white/5 rounded-xl px-4 py-3 text-white text-sm focus:border-[#FED90F]/50 outline-none transition-all"
                />
              </div>
            </div>
            <button
              type="submit"
              class="w-full bg-[#FED90F] text-[#0B0B0D] font-bold py-3 rounded-xl mt-4 hover:shadow-[0_0_20px_rgba(254,217,15,0.3)] transition-all"
            >
              Atualizar Senha
            </button>
          </form>
        }
      </div>
    </div>
  </div>
</div>
