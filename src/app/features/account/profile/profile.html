<div class="min-h-screen bg-[#0B0B0D] px-4 py-10">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <div class="bg-[#141418] border border-[#FED90F]/15 rounded-2xl p-6 flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-[#FED90F]/10 border border-[#FED90F]/20 flex items-center justify-center text-2xl flex-shrink-0">
        👤
      </div>
      <div>
        <h1 class="text-2xl font-black text-[#FED90F] font-[Fredoka]">Minha Conta</h1>
        <p class="text-white/40 text-sm mt-0.5">
          Olá, <span class="text-white/70 font-semibold">{{ user?.name ?? 'Usuário' }}</span>! Gerencie seu perfil abaixo.
        </p>
      </div>
    </div>

    <!-- Nav Links -->
    <div class="flex gap-2">
      <a routerLink="/account/profile"
         class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-[#FED90F]/10 border border-[#FED90F]/30 text-[#FED90F] text-sm font-semibold transition-all">
        <ng-icon name="heroUser" size="16"></ng-icon> Perfil
      </a>
      <a routerLink="/account/addresses"
         class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-[#1A1A22] border border-white/5 text-white/50 text-sm font-semibold hover:border-[#FED90F]/20 hover:text-white/80 transition-all">
        🏠 Endereços
      </a>
      <a routerLink="/account/orders"
         class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-[#1A1A22] border border-white/5 text-white/50 text-sm font-semibold hover:border-[#FED90F]/20 hover:text-white/80 transition-all">
        📦 Pedidos
      </a>
    </div>

    <!-- Tabs -->
    <div class="bg-[#141418] border border-[#FED90F]/15 rounded-2xl overflow-hidden">
      <div class="flex border-b border-[#FED90F]/10">
        <button
          (click)="activeTab.set('profile')"
          [class]="activeTab() === 'profile'
            ? 'flex-1 flex items-center justify-center gap-2 py-4 text-sm font-bold text-[#FED90F] border-b-2 border-[#FED90F] bg-[#FED90F]/5'
            : 'flex-1 flex items-center justify-center gap-2 py-4 text-sm font-medium text-white/40 hover:text-white/70 transition-colors'">
          <ng-icon name="heroUser" size="16"></ng-icon>
          Dados Pessoais
        </button>
        <button
          (click)="activeTab.set('password')"
          [class]="activeTab() === 'password'
            ? 'flex-1 flex items-center justify-center gap-2 py-4 text-sm font-bold text-[#FED90F] border-b-2 border-[#FED90F] bg-[#FED90F]/5'
            : 'flex-1 flex items-center justify-center gap-2 py-4 text-sm font-medium text-white/40 hover:text-white/70 transition-colors'">
          <ng-icon name="heroLockClosed" size="16"></ng-icon>
          Alterar Senha
        </button>
      </div>

      <!-- Profile Tab -->
      @if (activeTab() === 'profile') {
        <form (ngSubmit)="saveProfile()" class="p-6 space-y-4">

          <div class="space-y-1.5">
            <label for="pf-name" class="text-white/60 text-sm font-medium">Nome Completo</label>
            <input id="pf-name" type="text" [(ngModel)]="profileForm.name" name="name" required
              placeholder="Seu nome completo"
              class="w-full bg-[#1A1A22] border border-[#FED90F]/15 rounded-xl px-4 py-3 text-white text-sm placeholder-white/20 focus:outline-none focus:border-[#FED90F]/50 focus:ring-1 focus:ring-[#FED90F]/20 transition-all" />
          </div>

          <div class="space-y-1.5">
            <label for="pf-email" class="text-white/60 text-sm font-medium">E-mail</label>
            <input id="pf-email" type="email" [value]="user?.email ?? ''" name="email" disabled
              class="w-full bg-[#1A1A22]/50 border border-white/5 rounded-xl px-4 py-3 text-white/30 text-sm cursor-not-allowed" />
            <p class="text-white/30 text-xs">O e-mail não pode ser alterado.</p>
          </div>

          <div class="space-y-1.5">
            <label for="pf-phone" class="text-white/60 text-sm font-medium">Telefone</label>
            <input id="pf-phone" type="tel" [(ngModel)]="profileForm.phone" name="phone"
              placeholder="(99) 99999-9999"
              class="w-full bg-[#1A1A22] border border-[#FED90F]/15 rounded-xl px-4 py-3 text-white text-sm placeholder-white/20 focus:outline-none focus:border-[#FED90F]/50 focus:ring-1 focus:ring-[#FED90F]/20 transition-all" />
          </div>

          <button type="submit" [disabled]="isSavingProfile()"
            class="w-full bg-[#FED90F] hover:bg-[#E5C20D] disabled:opacity-50 disabled:cursor-not-allowed text-[#0B0B0D] font-bold py-3.5 rounded-xl transition-all hover:shadow-[0_0_20px_rgba(254,217,15,0.3)] active:scale-[0.98] text-sm mt-2">
            @if (isSavingProfile()) {
              <span class="flex items-center justify-center gap-2">
                <span class="w-4 h-4 rounded-full border-2 border-[#0B0B0D]/30 border-t-[#0B0B0D] animate-spin"></span>
                Salvando...
              </span>
            } @else {
              Salvar Alterações
            }
          </button>
        </form>
      }

      <!-- Password Tab -->
      @if (activeTab() === 'password') {
        <form (ngSubmit)="savePassword()" class="p-6 space-y-4">

          <div class="space-y-1.5">
            <label for="pw-current" class="text-white/60 text-sm font-medium">Senha Atual</label>
            <input id="pw-current" type="password" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" required
              placeholder="Digite sua senha atual"
              class="w-full bg-[#1A1A22] border border-[#FED90F]/15 rounded-xl px-4 py-3 text-white text-sm placeholder-white/20 focus:outline-none focus:border-[#FED90F]/50 focus:ring-1 focus:ring-[#FED90F]/20 transition-all" />
          </div>

          <div class="space-y-1.5">
            <label for="pw-new" class="text-white/60 text-sm font-medium">Nova Senha</label>
            <input id="pw-new" type="password" [(ngModel)]="passwordForm.newPassword" name="newPassword" required minlength="6"
              placeholder="Mínimo 6 caracteres"
              class="w-full bg-[#1A1A22] border border-[#FED90F]/15 rounded-xl px-4 py-3 text-white text-sm placeholder-white/20 focus:outline-none focus:border-[#FED90F]/50 focus:ring-1 focus:ring-[#FED90F]/20 transition-all" />
          </div>

          <div class="space-y-1.5">
            <label for="pw-confirm" class="text-white/60 text-sm font-medium">Confirmar Nova Senha</label>
            <input id="pw-confirm" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
              placeholder="Repita a nova senha"
              class="w-full bg-[#1A1A22] border border-[#FED90F]/15 rounded-xl px-4 py-3 text-white text-sm placeholder-white/20 focus:outline-none focus:border-[#FED90F]/50 focus:ring-1 focus:ring-[#FED90F]/20 transition-all" />
          </div>

          <button type="submit" [disabled]="isSavingPassword()"
            class="w-full bg-[#FED90F] hover:bg-[#E5C20D] disabled:opacity-50 disabled:cursor-not-allowed text-[#0B0B0D] font-bold py-3.5 rounded-xl transition-all hover:shadow-[0_0_20px_rgba(254,217,15,0.3)] active:scale-[0.98] text-sm mt-2">
            @if (isSavingPassword()) {
              <span class="flex items-center justify-center gap-2">
                <span class="w-4 h-4 rounded-full border-2 border-[#0B0B0D]/30 border-t-[#0B0B0D] animate-spin"></span>
                Salvando...
              </span>
            } @else {
              Alterar Senha
            }
          </button>
        </form>
      }
    </div>

  </div>
</div>
