<div class="min-h-screen bg-bg text-text-main px-4 py-16 relative overflow-hidden">
  <div class="absolute inset-0 z-0">
    <div
      class="absolute top-0 left-1/2 -translate-x-1/2 w-125 h-125 rounded-full bg-primary/5 blur-[120px]"
    ></div>
  </div>

  <div class="max-w-2xl mx-auto space-y-8 relative z-10">
    <div class="card p-8 flex items-center justify-between border-primary/20">
      <div class="flex items-center gap-6">
        <div
          class="w-16 h-16 rounded-2xl bg-primary-soft border border-primary-border flex items-center justify-center text-3xl"
        >
          <ng-icon name="lucideUser2" size="40"></ng-icon>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Minha Conta</h1>
          <p class="text-text-muted text-sm mt-1">
            Olá, <span class="text-primary">{{ user?.name ?? 'Usuário' }}</span>
          </p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2 bg-surface p-1.5 rounded-xl border border-border">
      <a
        routerLink="/account/profile"
        class="text-center py-2.5 text-xs font-bold text-black bg-primary rounded-lg shadow-lg"
        >Perfil</a
      >
      <a
        routerLink="/account/addresses"
        class="text-center py-2.5 text-xs font-semibold text-text-muted hover:text-text-main transition-colors"
        >Endereços</a
      >
      <a
        routerLink="/account/orders"
        class="text-center py-2.5 text-xs font-semibold text-text-muted hover:text-text-main transition-colors"
        >Pedidos</a
      >
    </div>

    <div class="card shadow-2xl overflow-hidden">
      <div class="flex border-b border-border">
        @for (tab of ['profile', 'password']; track tab) {
          <button
            type="button"
            (click)="setTab(tab)"
            class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest transition-all"
            [class.text-primary]="activeTab() === tab"
            [class.border-b-2]="activeTab() === tab"
            [class.border-primary]="activeTab() === tab"
            [class.text-text-muted]="activeTab() !== tab"
          >
            {{ tab === 'profile' ? 'Dados Pessoais' : 'Alterar Senha' }}
          </button>
        }
      </div>

      <div class="p-8">
        @if (activeTab() === 'profile') {
          <form (ngSubmit)="saveProfile()" class="space-y-6">
            <div>
              <label
                for="full-name"
                class="block text-[10px] font-bold text-text-muted uppercase mb-2 tracking-widest"
                >Nome Completo</label
              >
              <input
                id="full-name"
                [(ngModel)]="profileForm.name"
                name="name"
                class="input-field"
              />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  for="email-field"
                  class="block text-[10px] font-bold text-text-muted uppercase mb-2 tracking-widest"
                  >E-mail</label
                >
                <input
                  id="email-field"
                  [value]="user?.email ?? ''"
                  disabled
                  class="input-field opacity-60 cursor-not-allowed"
                />
              </div>
              <div>
                <label
                  for="phone-field"
                  class="block text-[10px] font-bold text-text-muted uppercase mb-2 tracking-widest"
                  >Telefone</label
                >
                <input
                  id="phone-field"
                  [(ngModel)]="profileForm.phone"
                  name="phone"
                  class="input-field"
                />
              </div>
            </div>

            <button type="submit" class="btn-primary w-full py-3.5">Salvar Alterações</button>
          </form>
        } @else {
          <form (ngSubmit)="savePassword()" class="space-y-6">
            <div>
              <label
                for="curr-password"
                class="block text-[10px] font-bold text-text-muted uppercase mb-2 tracking-widest"
                >Senha Atual</label
              >
              <input
                id="curr-password"
                type="password"
                [(ngModel)]="passwordForm.currentPassword"
                name="curr"
                class="input-field"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  for="new-password"
                  class="block text-[10px] font-bold text-text-muted uppercase mb-2 tracking-widest"
                  >Nova Senha</label
                >
                <input
                  id="new-password"
                  type="password"
                  [(ngModel)]="passwordForm.newPassword"
                  name="new"
                  class="input-field"
                />
              </div>
              <div>
                <label
                  for="conf-password"
                  class="block text-[10px] font-bold text-text-muted uppercase mb-2 tracking-widest"
                  >Confirmar</label
                >
                <input
                  id="conf-password"
                  type="password"
                  [(ngModel)]="confirmPassword"
                  name="conf"
                  class="input-field"
                />
              </div>
            </div>
            <button type="submit" class="btn-primary w-full py-3.5">Atualizar Senha</button>
          </form>
        }
      </div>
    </div>
  </div>
</div>
