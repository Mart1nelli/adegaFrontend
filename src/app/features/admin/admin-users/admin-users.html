<div class="space-y-6">
  <header class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-black tracking-tight">Usuários</h1>
      <p class="text-text-muted text-sm mt-0.5">Gerenciamento de acessos e contas</p>
    </div>
  </header>

  @if (isLoading()) {
    <div class="flex items-center justify-center py-20">
      <div
        class="w-8 h-8 rounded-full border-2 border-primary/20 border-t-primary animate-spin"
      ></div>
    </div>
  } @else {
    <div class="card overflow-hidden p-0">
      <table class="w-full text-left">
        <thead>
          <tr class="border-b border-border-soft">
            <th class="px-6 py-4 text-[10px] font-bold text-text-muted uppercase tracking-widest">
              ID
            </th>
            <th class="px-6 py-4 text-[10px] font-bold text-text-muted uppercase tracking-widest">
              Nome
            </th>
            <th class="px-6 py-4 text-[10px] font-bold text-text-muted uppercase tracking-widest">
              E-mail
            </th>
            <th class="px-6 py-4 text-[10px] font-bold text-text-muted uppercase tracking-widest">
              Perfil
            </th>
            <th
              class="px-6 py-4 text-right text-[10px] font-bold text-text-muted uppercase tracking-widest"
            >
              Ações
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border-soft">
          @for (user of users(); track user.id) {
            <tr class="hover:bg-surface transition-colors">
              <td class="px-6 py-4 text-xs font-mono text-text-dim">{{ user.id }}</td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div
                    class="w-8 h-8 rounded-full bg-primary-soft flex items-center justify-center text-primary text-[10px] font-bold"
                  >
                    {{ user.name.charAt(0).toUpperCase() }}
                  </div>
                  <span class="text-sm font-medium">{{ user.name }}</span>
                </div>
              </td>
              <td class="px-6 py-4 text-sm text-text-muted">{{ user.email }}</td>
              <td class="px-6 py-4">
                <span
                  class="text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider border"
                  [class]="
                    user.role === 'ADMIN'
                      ? 'bg-primary/10 text-primary border-primary/20'
                      : 'border-border text-text-dim'
                  "
                >
                  {{ user.role === 'ADMIN' ? 'Admin' : 'Usuário' }}
                </span>
              </td>
              <td class="px-6 py-4 text-right">
                <button
                  (click)="deleteUser(user)"
                  [disabled]="user.id === currentUserId"
                  class="p-2 rounded-lg text-text-muted hover:text-danger hover:bg-danger/10 transition-all disabled:opacity-20 disabled:cursor-not-allowed"
                >
                  <ng-icon name="lucideTrash2" size="16"></ng-icon>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
