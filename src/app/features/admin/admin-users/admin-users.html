<div class="space-y-6">
  <header class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Usuários</h1>
      <p class="text-white/40 text-sm">Gerenciamento de acessos e contas</p>
    </div>
  </header>

  @if (isLoading()) {
    <div class="flex items-center justify-center py-20">
      <div
        class="w-8 h-8 rounded-full border-2 border-primary/20 border-t-primary animate-spin"
      ></div>
    </div>
  } @else {
    <div class="bg-[#0A0A0B] border border-white/5 rounded-2xl overflow-hidden">
      <table class="w-full text-left">
        <thead>
          <tr class="border-b border-white/5">
            <th class="px-6 py-4 text-[10px] font-bold text-white/30 uppercase tracking-widest">
              ID
            </th>
            <th class="px-6 py-4 text-[10px] font-bold text-white/30 uppercase tracking-widest">
              Nome
            </th>
            <th class="px-6 py-4 text-[10px] font-bold text-white/30 uppercase tracking-widest">
              E-mail
            </th>
            <th class="px-6 py-4 text-[10px] font-bold text-white/30 uppercase tracking-widest">
              Perfil
            </th>
            <th
              class="px-6 py-4 text-right text-[10px] font-bold text-white/30 uppercase tracking-widest"
            >
              Ações
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-white/5">
          @for (user of users(); track user.id) {
            <tr class="hover:bg-white/[0.02] transition-colors group">
              <td class="px-6 py-4 text-xs font-mono text-white/40">{{ user.id }}</td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div
                    class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary text-[10px] font-bold"
                  >
                    {{ user.name.charAt(0).toUpperCase() }}
                  </div>
                  <span class="text-sm font-medium text-white">{{ user.name }}</span>
                </div>
              </td>
              <td class="px-6 py-4 text-sm text-white/60">{{ user.email }}</td>
              <td class="px-6 py-4">
                <span
                  class="text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider border"
                  [class]="
                    user.role === 'ADMIN'
                      ? 'bg-primary/10 text-primary border-primary/20'
                      : 'bg-white/5 text-white/40 border-white/10'
                  "
                >
                  {{ user.role === 'ADMIN' ? 'Admin' : 'Usuário' }}
                </span>
              </td>
              <td class="px-6 py-4 text-right">
                <button
                  (click)="deleteUser(user)"
                  [disabled]="user.id === currentUserId"
                  class="p-2 rounded-lg text-white/20 hover:text-red-400 hover:bg-red-400/10 transition-all disabled:opacity-20 disabled:cursor-not-allowed"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"
                    />
                    <path
                      fill-rule="evenodd"
                      d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"
                    />
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
