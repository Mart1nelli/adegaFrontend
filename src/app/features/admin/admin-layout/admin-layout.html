<div class="flex h-screen bg-[#050505] overflow-hidden text-gray-300">
  <aside
    class="w-60 min-w-60 bg-[#0A0A0B] border-r border-white/5 flex flex-col py-6 px-3 gap-1 overflow-y-auto"
  >
    <div class="flex items-center gap-2 px-3 pb-6 border-b border-white/5 mb-2">
      <div
        class="w-8 h-8 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center text-base"
      >
        <ng-icon name="lucideBeer" size="14"></ng-icon>
      </div>
      <span class="text-white font-bold text-sm tracking-tight">Adega do Pai</span>
      <span
        class="ml-auto text-[9px] font-bold text-primary bg-primary/10 px-1.5 py-0.5 rounded uppercase"
        >Admin</span
      >
    </div>

    <div class="flex items-center gap-3 px-3 py-3 bg-white/5 rounded-xl mb-6">
      <div
        class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold text-xs"
      >
        {{ (authService.currentUser()?.name ?? 'A')[0].toUpperCase() }}
      </div>
      <div class="overflow-hidden">
        <p class="text-white text-xs font-medium truncate">{{ authService.currentUser()?.name }}</p>
        <p class="text-white/30 text-[10px]">Administrador</p>
      </div>
    </div>

    <p class="text-white/20 text-[10px] font-bold uppercase tracking-widest px-3 py-1 mb-1">
      Gestão
    </p>

    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-white/5 text-primary border-white/10"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-transparent text-white/40 text-sm hover:text-white hover:bg-white/5 transition-all"
      >
        <ng-icon [name]="item.icon" size="18" class="text-base"></ng-icon>
        {{ item.label }}
      </a>
    }

    <div class="mt-auto pt-6 border-t border-white/5">
      <a
        routerLink="/home"
        class="flex items-center gap-2 px-3 text-white/20 text-xs hover:text-primary transition-colors"
      >
        <ng-icon name="lucideArrowLeft" size="14"></ng-icon>
        Voltar à loja
      </a>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto p-8">
    <router-outlet></router-outlet>
  </main>
</div>
