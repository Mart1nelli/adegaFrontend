<div
  class="group flex h-full flex-col overflow-hidden rounded-2xl bg-surface border border-border transition-all hover:border-text-dim"
>
  <div class="relative w-full h-80 overflow-hidden bg-bg flex items-center justify-center">
    @if (product().imageUrl) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      />
    } @else {
      <div class="flex flex-col items-center justify-center text-text-dim">
        <ng-icon name="heroPhoto" size="48" class="mb-2"></ng-icon>
        <span class="text-[10px] font-bold uppercase tracking-widest">Sem imagem</span>
      </div>
    }

    @if (product().category) {
      <div class="absolute left-3 top-3 z-10">
        <span
          class="px-3 py-1 rounded-full bg-black/60 backdrop-blur-md text-white text-[10px] font-bold uppercase tracking-widest border border-white/10"
        >
          {{ getCategoryName() }}
        </span>
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col p-6">
    <h3 class="font-bold text-lg text-text-main leading-tight mb-2">{{ product().name }}</h3>
    <p class="text-xs text-text-muted line-clamp-3 leading-relaxed mb-6">
      {{ product().description }}
    </p>

    <div class="mt-auto flex items-end justify-between">
      <div class="flex flex-col gap-0.5">
        <span class="text-xl font-bold text-primary">
          R$ {{ product().price | number: '1.2-2' }}
        </span>
        <span
          class="text-[10px] font-medium"
          [class]="product().stock > 0 ? 'text-success' : 'text-danger'"
        >
          {{ product().stock > 0 ? product().stock + ' em estoque' : 'Esgotado' }}
        </span>
      </div>

      <button
        (click)="onAddToCart()"
        [disabled]="product().stock === 0"
        class="flex p-3 rounded-xl bg-primary text-black transition-all hover:opacity-90 disabled:opacity-50 disabled:bg-text-dim active:scale-95"
      >
        <ng-icon name="lucidePlus" size="20"></ng-icon>
      </button>
    </div>
  </div>
</div>
