<div
  class="group flex h-full flex-col overflow-hidden rounded-2xl bg-[#0A0A0A] border border-gray-900 transition-all hover:border-gray-700"
>
  <div class="relative w-full h-56 overflow-hidden bg-gray-900">
    <img
      [src]="product().imageUrl || '/assets/images/placeholder.png'"
      [alt]="product().name"
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />

    <div class="absolute right-3 top-3">
      @if (product().stock === 0) {
        <span
          class="px-3 py-1 rounded-full bg-red-900/20 text-red-400 text-[10px] font-bold uppercase tracking-widest border border-red-900/50"
          >Esgotado</span
        >
      } @else if (product().stock < 10) {
        <span
          class="px-3 py-1 rounded-full bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-widest border border-primary/20"
          >Poucas unidades</span
        >
      }
    </div>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-6">
    @if (product().category) {
      <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500">{{
        getCategoryName()
      }}</span>
    }

    <h3 class="font-bold text-lg text-white leading-tight">
      {{ product().name }}
    </h3>

    <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed">
      {{ product().description }}
    </p>

    <div class="mt-auto pt-4 flex items-center justify-between">
      <span class="text-xl font-bold text-white">R$ {{ product().price | number: '1.2-2' }}</span>
      <button
        (click)="onAddToCart()"
        [disabled]="product().stock === 0"
        class="p-3 rounded-full bg-gray-900 border border-gray-800 text-primary transition-all hover:bg-primary hover:text-black disabled:opacity-50"
      >
        <ng-icon name="heroShoppingBag" size="18"></ng-icon>
      </button>
    </div>
  </div>
</div>
