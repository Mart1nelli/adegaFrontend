<div class="min-h-screen bg-bg text-text-main pt-32 pb-16 px-4">
  <div class="max-w-5xl mx-auto">
    <button
      (click)="goBack()"
      class="text-text-muted hover:text-primary transition-colors text-sm mb-12 flex items-center gap-2"
    >
      <ng-icon name="heroArrowLeft" size="16"></ng-icon>
      Voltar à coleção
    </button>

    @if (isLoading()) {
      <div class="flex justify-center py-20">
        <div
          class="animate-spin h-8 w-8 border-2 border-primary border-t-transparent rounded-full"
        ></div>
      </div>
    } @else if (product(); as prod) {
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
        <div class="rounded-3xl overflow-hidden bg-surface border border-border aspect-square">
          <img
            [src]="prod.imageUrl || '/assets/images/placeholder.png'"
            [alt]="prod.name"
            class="w-full h-full object-cover"
          />
        </div>

        <div class="flex flex-col">
          <span class="text-primary text-[10px] uppercase tracking-widest font-bold mb-4">
            {{ prod.category?.name || 'Bebidas' }}
          </span>
          <h1 class="text-4xl lg:text-6xl font-black mb-6 tracking-tight">{{ prod.name }}</h1>
          <p class="text-text-muted text-lg leading-relaxed mb-8">{{ prod.description }}</p>

          <div class="text-3xl font-black text-text-main mb-8">
            R$ {{ prod.price | number: '1.2-2' }}
          </div>

          <div class="flex items-center gap-4 border-t border-border pt-8">
            <div class="flex items-center bg-surface border border-border rounded-xl p-1">
              <button
                (click)="decreaseQuantity()"
                class="w-10 h-10 flex items-center justify-center hover:text-primary transition-colors"
              >
                <ng-icon name="heroMinus" size="16"></ng-icon>
              </button>
              <span class="w-12 text-center font-bold">{{ quantity() }}</span>
              <button
                (click)="increaseQuantity()"
                class="w-10 h-10 flex items-center justify-center hover:text-primary transition-colors"
              >
                <ng-icon name="heroPlus" size="16"></ng-icon>
              </button>
            </div>

            <button (click)="addToCart()" class="flex-1 btn-primary py-3.5">
              Adicionar ao carrinho
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
