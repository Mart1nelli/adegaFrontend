<div class="min-h-screen bg-[#050505] text-white pt-32 pb-16 px-4">
  <div class="max-w-5xl mx-auto">
    <button
      (click)="goBack()"
      class="text-gray-500 hover:text-white transition-colors text-sm mb-12 flex items-center gap-2"
    >
      ← Voltar à coleção
    </button>

    @if (isLoading()) {
      <div class="flex justify-center py-20">
        <div
          class="animate-spin h-8 w-8 border-2 border-primary border-t-transparent rounded-full"
        ></div>
      </div>
    } @else if (product(); as prod) {
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
        <div class="rounded-3xl overflow-hidden bg-[#0A0A0A] border border-gray-900">
          <img
            [src]="prod.imageUrl || '/assets/images/placeholder.png'"
            [alt]="prod.name"
            class="w-full h-full object-cover"
          />
        </div>

        <div class="flex flex-col">
          <span class="text-primary text-xs uppercase tracking-widest font-bold mb-4">{{
            prod.category?.name || 'Bebidas'
          }}</span>
          <h1 class="text-4xl lg:text-6xl font-bold mb-6">{{ prod.name }}</h1>
          <p class="text-gray-400 text-lg leading-relaxed mb-8">{{ prod.description }}</p>

          <div class="text-3xl font-bold text-white mb-8">
            R$ {{ prod.price | number: '1.2-2' }}
          </div>

          <div class="flex items-center gap-4 border-t border-gray-900 pt-8">
            <div class="flex items-center bg-[#0A0A0A] border border-gray-900 rounded-xl p-1">
              <button
                (click)="decreaseQuantity()"
                class="w-10 h-10 hover:text-primary transition-colors"
              >
                -
              </button>
              <span class="w-12 text-center font-bold">{{ quantity() }}</span>
              <button
                (click)="increaseQuantity()"
                class="w-10 h-10 hover:text-primary transition-colors"
              >
                +
              </button>
            </div>
            <button
              (click)="addToCart()"
              class="flex-1 bg-primary text-black font-bold py-3.5 rounded-xl hover:bg-white transition-all"
            >
              Adicionar ao carrinho
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
