@if (isVisible()) {
  <button
    type="button"
    (click)="goBack()"
    class="fixed left-3 top-[5.25rem] z-40 inline-flex min-h-9 items-center gap-2 rounded-full border border-border bg-surface/90 px-3 py-2 text-xs font-semibold text-text-muted shadow-md shadow-black/10 backdrop-blur-md transition hover:border-primary hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary sm:left-6 sm:top-[5.5rem] sm:min-h-10 sm:px-4"
    aria-label="Voltar para a página anterior"
  >
    <ng-icon name="lucideArrowLeft" size="16"></ng-icon>
    <span class="hidden sm:inline">Voltar</span>
  </button>
}
