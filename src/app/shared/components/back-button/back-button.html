@if (isVisible()) {
  <button
    type="button"
    (click)="goBack()"
    class="fixed left-4 top-[5.5rem] z-40 inline-flex min-h-10 items-center gap-2 rounded-full border border-border bg-surface/90 px-4 py-2 text-xs font-semibold text-text-muted shadow-lg shadow-black/10 backdrop-blur-md transition hover:border-primary hover:text-primary sm:left-6"
    aria-label="Voltar para a página anterior"
  >
    <ng-icon name="lucideArrowLeft" size="16"></ng-icon>
    <span>Voltar</span>
  </button>
}
