<header class="header" [class.header-scrolled]="isScrolled()">
  <div class="header-container">
    <!-- Logo -->
    <div class="header-logo">
      <a routerLink="/home" class="logo-link">
        <span class="logo-text">Adega do Pai</span>
      </a>
    </div>

    <!-- Barra de busca -->
    <div class="header-search">
      <div class="search-container">
        <ng-icon name="heroMagnifyingGlass" size="18" class="search-icon"></ng-icon>
        <input
          type="text"
          placeholder="Buscar bebidas..."
          class="search-input"
        >
      </div>
    </div>

    <!-- Ações do usuário -->
    <div class="header-actions">
      <button class="action-btn explore-btn" routerLink="/products">
        <ng-icon name="heroBuildingStorefront" size="16" class="btn-icon"></ng-icon>
        <span>Explorar Bebidas</span>
      </button>

      @if (isAuthenticated()) {
        <div class="user-menu">
          <button class="action-btn" routerLink="/account/profile">
            <ng-icon name="heroUser" size="16" class="btn-icon"></ng-icon>
            <span>{{ (currentUser()?.name ?? 'Conta').split(' ')[0] }}</span>
          </button>
          @if (currentUser()?.role === 'admin') {
            <button class="action-btn admin-btn" routerLink="/admin">
              <span>Admin</span>
            </button>
          }
          <button class="action-btn logout-btn" (click)="logout()">
            <span>Sair</span>
          </button>
        </div>
      } @else {
        <button class="action-btn" routerLink="/auth/login">
          <ng-icon name="heroUser" size="16" class="btn-icon"></ng-icon>
          <span>Entrar</span>
        </button>
      }

      <button class="action-btn cart-btn" routerLink="/cart">
        <ng-icon name="heroShoppingBag" size="20" class="cart-icon"></ng-icon>
        @if (cartCount() > 0) {
          <span class="cart-count">{{ cartCount() }}</span>
        }
      </button>
    </div>
  </div>
</header>
