<header
  class="fixed inset-x-0 top-0 z-50 w-full transition-all duration-500 backdrop-blur-xl border-b border-gray-900"
  [class]="isScrolled() ? 'bg-[#050505]/95 py-3' : 'bg-transparent py-5'"
>
  <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-6">
    <a routerLink="/home" class="flex items-center gap-2">
      <span class="text-xl font-bold tracking-tighter text-white"
        >ADEGA <span class="text-primary">DO PAI</span></span
      >
    </a>

    <div class="hidden md:flex flex-1 max-w-sm mx-8">
      <div class="relative w-full">
        <ng-icon
          name="heroMagnifyingGlass"
          size="16"
          class="absolute left-3 top-3 text-gray-600"
        ></ng-icon>
        <input
          type="text"
          placeholder="Buscar rótulo..."
          class="w-full bg-[#0A0A0A] border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-700 focus:border-primary outline-none transition-all"
        />
      </div>
    </div>

    <div class="flex items-center gap-6">
      <a
        routerLink="/products"
        class="text-sm font-semibold text-gray-400 hover:text-white transition-colors"
      >
        Catálogo
      </a>

      @if (isAuthenticated()) {
        <a
          routerLink="/account/profile"
          class="flex items-center gap-2 text-sm font-semibold text-gray-400 hover:text-white transition-colors"
        >
          <ng-icon name="heroUser" size="16"></ng-icon>
          {{ (currentUser()?.name ?? 'Conta').split(' ')[0] }}
        </a>

        @if (currentUser()?.role === 'ADMIN') {
          <a
            routerLink="/admin"
            class="flex items-center gap-2 px-3 py-1 rounded-full border border-primary text-primary text-xs font-bold transition-all hover:bg-primary hover:text-black active:scale-95"
          >
            <ng-icon name="lucideShieldCheck" size="14"></ng-icon>
            Admin
          </a>
        }

        <button
          (click)="logout()"
          class="flex items-center text-sm font-semibold text-gray-500 hover:text-white transition-colors"
        >
          <ng-icon name="lucideLogOut" size="16"></ng-icon>
        </button>
      } @else {
        <a
          routerLink="/auth/login"
          class="flex items-center gap-2 text-sm font-semibold text-white hover:text-primary transition-colors"
        >
          <ng-icon name="heroUser" size="16"></ng-icon>
          Entrar
        </a>
      }

      <button
        routerLink="/cart"
        class="relative flex items-center gap-2 px-3 py-1 rounded-full bg-primary text-black font-bold transition-all hover:opacity-90 active:scale-95"
      >
        <ng-icon name="heroShoppingBag" size="18"></ng-icon>
        <span>Carrinho</span>

        @if (cartCount() > 0) {
          <span
            class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-black text-[10px] font-bold text-white"
          >
            {{ cartCount() }}
          </span>
        }
      </button>
    </div>
  </div>
</header>
