<div class="fixed top-20 right-6 z-[9999] flex flex-col gap-3 pointer-events-none">
  @for (notification of notifications; track notification.id) {
    <div
      #notificationElement
      class="notification pointer-events-auto flex items-start gap-4 p-4 rounded-xl border border-gray-800 bg-[#0A0A0A]/90 backdrop-blur-xl shadow-2xl transition-all duration-300 opacity-0 translate-x-10 min-w-[320px] max-w-sm"
      [ngClass]="'notification--' + notification.type"
    >
      <div class="mt-0.5">
        <ng-icon
          [name]="getNotificationIcon(notification.type)"
          size="20"
          class="text-primary"
        ></ng-icon>
      </div>

      <div class="flex-1">
        <div class="text-sm font-bold text-white">{{ notification.title }}</div>
        <div class="text-xs text-gray-400 mt-0.5">{{ notification.message }}</div>
      </div>

      <button
        class="text-gray-600 hover:text-white transition-colors"
        (click)="removeNotification(notification.id)"
        aria-label="Fechar notificação"
      >
        <ng-icon name="heroXMark" size="16"></ng-icon>
      </button>
    </div>
  }
</div>
