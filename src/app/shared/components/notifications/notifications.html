<div class="fixed top-20 right-6 z-[9999] flex flex-col gap-3 pointer-events-none">
  @for (notification of notifications(); track notification.id) {
    <div
      #notificationElement
      class="notification pointer-events-auto flex items-start gap-4 p-4 rounded-xl border border-border bg-surface/90 backdrop-blur-xl shadow-2xl transition-all duration-300 opacity-0 translate-x-10 min-w-[320px] max-w-sm"
      [ngClass]="'notification--' + notification.type"
    >
      <div class="mt-0.5">
        <ng-icon
          [name]="getNotificationIcon(notification.type)"
          size="20"
          [ngClass]="{
            'text-green-400': notification.type === 'success',
            'text-red-400': notification.type === 'error',
            'text-yellow-400': notification.type === 'warning',
            'text-blue-400': notification.type === 'info'
          }"
        ></ng-icon>
      </div>

      <div class="flex-1">
        <div class="text-sm font-bold text-text-main">{{ notification.title }}</div>
        <div class="text-xs text-text-muted mt-0.5">{{ notification.message }}</div>
      </div>

      <button
        class="text-text-dim hover:text-text-main transition-colors"
        (click)="removeNotification(notification.id)"
        aria-label="Fechar notificação"
      >
        <ng-icon name="heroXMark" size="16"></ng-icon>
      </button>
    </div>
  }
</div>

@if (confirmation(); as confirmation) {
  <div
    class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/60 px-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirmation-title"
  >
    <div class="w-full max-w-md rounded-xl border border-border bg-surface p-6 shadow-2xl">
      <h2 id="confirmation-title" class="text-lg font-bold text-text-main">
        {{ confirmation.title }}
      </h2>
      <p class="mt-2 text-sm leading-relaxed text-text-muted">
        {{ confirmation.message }}
      </p>
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" class="btn-secondary" (click)="resolveConfirmation(false)">
          {{ confirmation.cancelText }}
        </button>
        <button
          type="button"
          [class]="confirmation.danger ? 'btn-danger' : 'btn-primary'"
          (click)="resolveConfirmation(true)"
        >
          {{ confirmation.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
